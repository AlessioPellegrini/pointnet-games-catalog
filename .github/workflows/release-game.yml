name: Release Game Package

on:
  push:
    tags:
      - '*-v*'

jobs:
  release:
    name: Build & Release Game Zip
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse tag and package game
        id: package
        run: |
          TAG="${{ github.ref_name }}"
          echo "Processing tag: $TAG"

          # Extract slug and version from tag (e.g. mahjong-v1.8.0 -> slug=mahjong, version=1.8.0)
          # or minesweeper-arcade-v1.3.6 -> slug=minesweeper-arcade, version=1.3.6
          SLUG=$(echo "$TAG" | sed -E 's/-v[0-9]+.*$//')
          VERSION=$(echo "$TAG" | sed -E 's/^.*-v//')

          echo "Target game slug: $SLUG"
          echo "Target game version: $VERSION"

          if [ ! -d "games/$SLUG" ]; then
            echo "Error: Directory games/$SLUG not found!"
            exit 1
          fi

          ZIP_NAME="${SLUG}.zip"
          cd "games/$SLUG"
          zip -r "../../${ZIP_NAME}" . -x "*.git*" -x "*.DS_Store*" -x "*.py" -x "*.sh"
          cd ../..

          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "slug=${SLUG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip_name }}
          name: "${{ steps.package.outputs.slug }} v${{ steps.package.outputs.version }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
